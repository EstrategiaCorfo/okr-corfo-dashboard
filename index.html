<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard OKR Corfo</title>
  <style>
    :root{--azul:#221E7C;--gris:#3F3F3F;--fondo:#F7F7FA;--coral:#FD8983;--verde:#78D6BB;--celeste:#72C7D5;--amarillo:#F5C86A;--borde:#E8E8F2;--sombra:0 18px 45px rgba(34,30,124,.10)}
    *{box-sizing:border-box} body{margin:0;background:var(--fondo);color:var(--gris);font-family:'Segoe UI',Arial,sans-serif} a{text-decoration:none;color:inherit}
    .topbar{position:sticky;top:0;z-index:5;background:var(--azul);color:white;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:white;color:var(--azul);display:grid;place-items:center;font-weight:900}.brand strong{display:block}.brand span{display:block;font-size:12px;opacity:.85}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:white;border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:white;color:var(--azul)}
    .shell{max-width:1240px;margin:auto;padding:30px 24px 50px}.hero{background:linear-gradient(135deg,var(--azul),#3430A0);border-radius:30px;padding:30px;color:white;box-shadow:var(--sombra);display:grid;grid-template-columns:1.6fr .8fr;gap:22px;margin-bottom:24px}.hero h1{font-size:38px;line-height:1.05;margin:12px 0 10px;color:white}.hero p{font-size:16px;line-height:1.55;opacity:.9;margin:0}.eyebrow{display:inline-flex;gap:14px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.20);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}.update{display:flex;flex-direction:column;line-height:1.15}.hero-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:22px}.hero-card span{font-size:13px;opacity:.85}.hero-card strong{display:block;font-size:48px;color:white;margin-top:6px}
    .grid{display:grid;gap:18px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:24px}.card{background:white;border:1px solid var(--borde);border-radius:24px;padding:20px;box-shadow:0 8px 26px rgba(34,30,124,.06)}.card h3,.card h2{margin:0 0 8px;color:var(--azul)}.muted{color:#6C6C79}.kpi small{font-weight:800;color:#777;text-transform:uppercase}.kpi strong{display:block;font-size:34px;color:var(--azul);margin-top:6px}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,1fr)}
    .section{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:30px 0 14px}.section h2{margin:0;color:var(--azul)}.section p{margin:6px 0 0;color:#666}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--azul);color:white}.btn.secondary{background:#F1F0FB;color:var(--azul)}.btn.ghost{background:white;border:1px solid var(--borde);color:var(--azul)}
    .progress{height:11px;border-radius:999px;background:#ECECF4;overflow:hidden}.progress span{display:block;height:100%;width:var(--v);background:linear-gradient(90deg,var(--verde),var(--celeste));border-radius:999px}.progress.coral span{background:var(--coral)}.progress.amber span{background:var(--amarillo)}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.verde{background:rgba(120,214,187,.24);color:#137A63}.amarillo{background:rgba(245,200,106,.28);color:#8A5D00}.rojo{background:rgba(253,137,131,.28);color:#A9342D}.mini{font-size:12px;color:#777}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.ranking-item{display:grid;grid-template-columns:42px 1fr 80px;gap:14px;align-items:center;margin:13px 0}.rank{width:34px;height:34px;border-radius:12px;background:#F0EFFB;color:var(--azul);display:grid;place-items:center;font-weight:900}.ger-card{display:flex;flex-direction:column;gap:14px}.ger-card .top{display:flex;justify-content:space-between;gap:12px}.ger-card h3{font-size:18px}.meta{display:flex;gap:10px;flex-wrap:wrap}.meta span{background:#F7F7FA;border:1px solid var(--borde);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.alert{border-left:6px solid var(--coral);padding:14px;border-radius:16px;background:#FFF7F7;margin-bottom:12px}.okr-objective{margin-bottom:18px}.kr{border:1px solid var(--borde);border-radius:18px;padding:14px;margin-top:12px;background:#fff}.kr-title{font-weight:800;color:var(--azul);margin-bottom:8px}.kr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.kr-grid div{background:#F7F7FA;border-radius:14px;padding:10px}.kr-grid span{display:block;font-size:11px;text-transform:uppercase;font-weight:800;color:#777}.kr-grid strong{display:block;margin-top:4px}.chart-wrap{display:none;margin-top:14px}.chart-wrap.open{display:block}.chart{width:100%;height:220px;border:1px solid var(--borde);border-radius:18px;background:#FCFCFE}.point{cursor:pointer}.tooltip{position:absolute;display:none;background:white;border:1px solid var(--borde);box-shadow:var(--sombra);border-radius:14px;padding:10px;font-size:12px;max-width:240px}.table{width:100%;border-collapse:separate;border-spacing:0 10px}.table th{text-align:left;font-size:12px;text-transform:uppercase;color:#777}.table td{background:white;border-top:1px solid var(--borde);border-bottom:1px solid var(--borde);padding:12px}.table td:first-child{border-left:1px solid var(--borde);border-radius:14px 0 0 14px}.table td:last-child{border-right:1px solid var(--borde);border-radius:0 14px 14px 0}.form{display:grid;gap:12px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--borde);border-radius:14px;padding:12px;font-family:inherit}.hidden{display:none!important}
    @media(max-width:900px){.hero,.two,.three,.kpis{grid-template-columns:1fr}.topbar{position:relative;align-items:flex-start;flex-direction:column}.hero h1{font-size:30px}.ranking-item{grid-template-columns:34px 1fr 60px}.kr-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="mark">C</div><div><strong>Panel OKR Corfo</strong><span>Estrategia institucional 2026 | Maqueta ejecutiva</span></div></div>
  <nav class="nav" id="nav"><button data-page="panel">Panel general</button><button data-page="detalle">Detalle gerencia</button><button data-page="ranking">Ranking</button><button data-page="historico">Histórico</button><button data-page="carga">Carga avances</button></nav>
</header>
<div class="shell">
  <section class="page" id="panel"></section>
  <section class="page hidden" id="detalle"></section>
  <section class="page hidden" id="ranking"></section>
  <section class="page hidden" id="historico"></section>
  <section class="page hidden" id="carga"></section>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
const gerencias=[
{id:'gif',sigla:'GIF',nombre:'Inversión y Financiamiento',cumplimiento:57,estado:'Amarillo',responsable:'Subgerente de Inversión y Financiamiento',desc:'Financiamiento para la reactivación y la inversión.'},
{id:'ged',sigla:'GED',nombre:'Emprendimiento Dinámico',cumplimiento:61,estado:'Amarillo',responsable:'Gerente de Emprendimiento Dinámico',desc:'Emprendimiento, escalamiento e impacto económico medible.'},
{id:'gi',sigla:'GI',nombre:'Innovación',cumplimiento:52,estado:'Amarillo',responsable:'Gerente de Innovación',desc:'Innovación empresarial, transformación digital e IA.'},
{id:'gct',sigla:'GCT',nombre:'Capacidades Tecnológicas',cumplimiento:49,estado:'Amarillo',responsable:'Subdirección de Programas Tecnológicos',desc:'I+D, institutos tecnológicos y adopción productiva.'},
{id:'gdt',sigla:'GDT',nombre:'Desarrollo Territorial',cumplimiento:54,estado:'Amarillo',responsable:'Subgerente de Desarrollo Territorial',desc:'Descentralización efectiva y pertinencia regional.'},
{id:'gae',sigla:'GAE',nombre:'Asuntos Estratégicos',cumplimiento:46,estado:'Amarillo',responsable:'Gerente de Asuntos Estratégicos',desc:'Arquitectura estratégica, articulación y aprendizaje institucional.'},
{id:'gg',sigla:'GG',nombre:'Gerencia General',cumplimiento:44,estado:'Amarillo',responsable:'Gerencia General',desc:'Eficiencia institucional, datos, personas y control de gestión.'}
];
const objetivos=[
{id:'gif1',g:'gif',o:'Masificar el acceso a crédito de las MiPYMEs que hoy están fuera del sistema financiero',owner:'Subgerente de Inversión y Financiamiento',k:[['KR1','Volumen total de crédito Corfo MiPYME colocado vía intermediarios financieros','MM$365.000','MM$420.000','MM$389.000',44],['KR2','N° de MiPYMEs que acceden por primera vez a financiamiento Corfo en el año','8.000','12.000','10.100',53],['KR3','% de colocaciones en regiones distintas a la Región Metropolitana','42%','52%','47%',50],['KR4','% de créditos con titular o representante mujer','28%','38%','33%',50]]},
{id:'gif2',g:'gif',o:'Convertir a Corfo en catalizador de capital de riesgo para emprendimientos de alto potencial',owner:'Departamento de Capital de Riesgo',k:[['KR1','Capital privado movilizado por cada peso de Corfo invertido en fondos de capital de riesgo','1,8x','2,5x','2,2x',57],['KR2','Emprendimientos apoyados que generan al menos 10 nuevos empleos en el año','45','90','69',53],['KR3','Fondos Corfo con política activa de inversión en empresas medianas','2','6','4',50]]},
{id:'ged1',g:'ged',o:'Hacer que el portafolio de emprendimientos apoyados genere impacto económico real y medible',owner:'Gerente de Emprendimiento Dinámico',k:[['KR1','Ventas totales generadas por emprendimientos y startups del portafolio activo','USD 180 M','USD 280 M','USD 238 M',58],['KR2','Capital privado levantado por emprendimientos y startups Corfo','USD 90 M','USD 160 M','USD 132 M',60],['KR3','Empleos generados por emprendimientos y startups del portafolio activo','3.200','5.500','4.520',57]]},
{id:'ged2',g:'ged',o:'Fortalecer el emprendimiento femenino como motor de inclusión económica y generación de empleo',owner:'Subdirección de Ecosistemas',k:[['KR1','% de startups lideradas por mujeres en el portafolio total de la GED','31%','45%','39%',57],['KR2','Capital accedido por emprendimientos liderados por mujeres vía instrumentos GED','USD 12 M','USD 28 M','USD 21 M',56],['KR3','Brecha de financiamiento entre emprendimientos liderados por hombres vs. mujeres','2,3x','1,5x','1,8x',63]]},
{id:'gi1',g:'gi',o:'Hacer que la innovación empresarial apoyada por Corfo se traduzca en crecimiento de ventas y empleo',owner:'Gerente de Innovación',k:[['KR1','Aumento promedio de ventas de empresas que completan programas GI','8%','18%','14%',60],['KR2','Empleos netos generados por empresas que completaron programas GI','620','1.400','980',46],['KR3','Pymes apoyadas que acceden a un mercado nuevo','12%','28%','21%',56]]},
{id:'gi2',g:'gi',o:'Acelerar la adopción de inteligencia artificial en empresas apoyadas',owner:'Subdirección de Innovación Empresarial',k:[['KR1','Empresas que incorporan herramientas de IA en procesos productivos o comerciales','0','600','260',43],['KR2','Convocatorias GI que incorporan IA como criterio de evaluación','0%','60%','35%',58],['KR3','Productividad declarada en empresas que adoptaron IA vía programas GI','0%','15%','7%',47]]},
{id:'gct1',g:'gct',o:'Hacer que la I+D financiada por Corfo genere adopción tecnológica comprobable',owner:'Subdirección de Programas Tecnológicos',k:[['KR1','Proyectos de I+D que reportan adopción tecnológica en empresas dentro de 24 meses','22%','42%','32%',50],['KR2','Proyectos colaborativos empresa-universidad-ITP activos','18','45','30',44],['KR3','Monto privado apalancado por cada peso público invertido','0,6x','1,3x','0,95x',50]]},
{id:'gct2',g:'gct',o:'Posicionar los ITP como proveedores reales de soluciones para la industria',owner:'Desarrollo Tecnológico Estratégico',k:[['KR1','ITP con plan estratégico productivo y convenio de desempeño activo','4','10','7',50],['KR2','Servicios tecnológicos prestados por ITP a empresas privadas del portafolio','85','210','138',42],['KR3','ITP con contrato de transferencia tecnológica o licencia activa','28%','60%','43%',47]]},
{id:'gdt1',g:'gdt',o:'Consolidar el modelo CDPR como plataforma real de decisión y ejecución descentralizada',owner:'Subgerente de Desarrollo Territorial',k:[['KR1','Regiones con CDPR que amplían participación de empresas y emprendedores','0','16','8',50],['KR2','Presupuesto regionalizado ejecutado con decisión formal del CDPR local','35%','50%','43%',53],['KR3','Instrumentos de gerencias de negocio delegados y ejecutados por Direcciones Regionales','12','26','20',57]]},
{id:'gdt2',g:'gdt',o:'Generar inteligencia territorial que mejore la pertinencia de las decisiones de Corfo',owner:'Análisis y Data Territorial',k:[['KR1','Regiones con diagnóstico de brechas productivas actualizado','3','16','9',46],['KR2','Decisiones de asignación fundamentadas en análisis territorial GDT','0','30','14',47],['KR3','Direcciones Regionales que usan IA o análisis automatizado para diagnóstico','0','8','3',38]]},
{id:'gae1',g:'gae',o:'Completar y anclar la arquitectura estratégica 2026-2030 como brújula institucional',owner:'Gerente de Asuntos Estratégicos',k:[['KR1','Arquitectura estratégica aprobada y OKRs alineados','En construcción','Aprobada','55%',55],['KR2','Decisiones de asignación de recursos que citan la arquitectura estratégica','0','20','8',40],['KR3','Iniciativas corporativas GAE con métrica de impacto definida','25%','80%','50%',45]]},
{id:'gae2',g:'gae',o:'Gestionar el conocimiento institucional para que Corfo aprenda de su experiencia',owner:'Unidad de Estrategia',k:[['KR1','Evaluaciones de impacto publicadas con aprendizajes operacionalizados','3','10','6',43],['KR2','Programas con más de 3 años que tienen evaluación de impacto publicada','20%','55%','36%',46],['KR3','Lecciones aprendidas documentadas y difundidas entre gerencias','0','20','10',50]]},
{id:'gg1',g:'gg',o:'Reducir la burocracia interna para dedicar más tiempo al impacto y menos al proceso',owner:'Procesos, Operaciones e Innovación',k:[['KR1','Tiempo promedio de resolución desde postulación hasta respuesta formal','42 días','30 días','36 días',50],['KR2','Pasos eliminados en procesos críticos de atención a usuarios','0','35','14',40],['KR3','Trámites Corfo disponibles en modo 100% digital','55%','82%','66%',41]]},
{id:'gg2',g:'gg',o:'Transformar los datos institucionales en un activo estratégico para decisiones',owner:'Planificación, Gestión y Datos',k:[['KR1','Programas con evaluación de impacto publicada en el año','18%','45%','30%',44],['KR2','Tableros de datos operativos disponibles en tiempo real','3','12','7',44],['KR3','Rezago de actualización de datos para reporte a VPE y GG','30 días','7 días','18 días',52]]}
];
function estado(v){return v>=70?'Verde':v>=40?'Amarillo':'Rojo'} function cls(v){return v<40?'coral':v<70?'amber':''} function avg(a){return Math.round(a.reduce((x,y)=>x+y,0)/a.length)}
function krId(o,i){return o.id+'_'+i} function hist(v){let out=[];let base=Math.max(5,v-38);['Ene','Mar','May','Jul','Sep','Nov'].forEach((m,i)=>out.push({m,v:Math.min(100,Math.round(base+(v-base)*(i+1)/6+(i%2?3:-2)))}));out[out.length-1].v=v;return out}
const $=id=>document.getElementById(id); const navBtns=[...document.querySelectorAll('#nav button')];
function go(page){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$(page).classList.remove('hidden');navBtns.forEach(b=>b.classList.toggle('active',b.dataset.page==page)); if(page=='panel') renderPanel(); if(page=='detalle') renderDetalle(); if(page=='ranking') renderRanking(); if(page=='historico') renderHistorico(); if(page=='carga') renderCarga(); window.scrollTo(0,0)} navBtns.forEach(b=>b.onclick=()=>go(b.dataset.page));
function hero(title,desc){return `<div class="hero"><div><span class="eyebrow"><span>Periodo 2026</span><span class="update"><span>Última actualización</span><strong>05-05-2026</strong></span></span><h1>${title}</h1><p>${desc}</p></div><aside class="hero-card"><span>Cumplimiento institucional</span><strong>${avg(gerencias.map(g=>g.cumplimiento))}%</strong><div class="progress" style="--v:${avg(gerencias.map(g=>g.cumplimiento))}%"><span></span></div></aside></div>`}
function renderPanel(){let ins=avg(gerencias.map(g=>g.cumplimiento));$('panel').innerHTML=hero('Panel OKR Estrategia Institucional Corfo','Vista ejecutiva para monitorear objetivos, resultados clave, avance por gerencia, alertas y trazabilidad bimensual.')+`<div class="grid kpis"><div class="card kpi"><small>Promedio institucional</small><strong>${ins}%</strong></div><div class="card kpi"><small>Gerencias</small><strong>${gerencias.length}</strong></div><div class="card kpi"><small>Objetivos activos</small><strong>${objetivos.length}</strong></div><div class="card kpi"><small>Resultados clave</small><strong>${objetivos.reduce((a,o)=>a+o.k.length,0)}</strong></div></div><div class="section"><div><h2>Ranking por gerencia</h2><p>Ordenado por cumplimiento global. Foco en visibilidad ejecutiva y gestión basada en evidencia.</p></div><button class="btn ghost" onclick="go('ranking')">Ver comparación</button></div><div class="card">${rankingHtml()}</div><div class="section"><div><h2>Cards por gerencia</h2><p>Lectura rápida de cumplimiento, estado, objetivos activos y resultados clave.</p></div></div><div class="grid three">${gerencias.map(g=>gerCard(g)).join('')}</div><div class="section"><div><h2>Alertas de gestión</h2><p>Resultados clave bajo umbral o con riesgo de avance.</p></div></div><div class="grid two"><div class="card">${alertas()}</div><div class="card"><h3>Próximos focos</h3><p class="muted">Validar líneas base sin dato, consolidar responsables y formalizar frecuencia bimensual de actualización.</p><button class="btn" onclick="go('carga')">Cargar avance</button></div></div>`}
function gerCard(g){let os=objetivos.filter(o=>o.g==g.id),k=os.reduce((a,o)=>a+o.k.length,0);return `<article class="card ger-card"><div class="top"><div><h3>${g.nombre}</h3><div class="mini">${g.sigla} · ${g.responsable}</div></div><span class="pill ${g.estado.toLowerCase()}">${g.estado}</span></div><strong style="font-size:34px;color:var(--azul)">${g.cumplimiento}%</strong><div class="progress ${cls(g.cumplimiento)}" style="--v:${g.cumplimiento}%"><span></span></div><div class="meta"><span>${os.length} objetivos</span><span>${k} KR</span><span>05-05-2026</span></div><button class="btn secondary" onclick="goDetalle('${g.id}')">Ver detalle</button></article>`}
function rankingHtml(){return gerencias.slice().sort((a,b)=>b.cumplimiento-a.cumplimiento).map((g,i)=>`<div class="ranking-item"><div class="rank">${i+1}</div><div><div class="row"><strong>${g.nombre}</strong><span class="pill ${g.estado.toLowerCase()}">${g.estado}</span></div><div class="progress ${cls(g.cumplimiento)}" style="--v:${g.cumplimiento}%"><span></span></div></div><strong>${g.cumplimiento}%</strong></div>`).join('')}
function alertas(){let items=[];objetivos.forEach(o=>o.k.forEach((k,i)=>{if(k[5]<45)items.push(`<div class="alert"><strong>${k[0]} · ${gerencias.find(g=>g.id==o.g).sigla}</strong><br>${k[1]}<br><span class="mini">Cumplimiento: ${k[5]}%</span></div>`)}));return items.join('')||'<p>Sin alertas críticas.</p>'}
let selected='gif';function goDetalle(id){selected=id;go('detalle')}function renderDetalle(){let g=gerencias.find(x=>x.id==selected)||gerencias[0];let opts=gerencias.map(x=>`<option value="${x.id}" ${x.id==g.id?'selected':''}>${x.nombre}</option>`).join('');let os=objetivos.filter(o=>o.g==g.id);$('detalle').innerHTML=hero('Detalle de gerencia: '+g.nombre,g.desc)+`<div class="card row"><div><strong>Gerencia seleccionada</strong><br><span class="muted">Responsable: ${g.responsable}</span></div><select id="selGer" style="padding:12px;border-radius:14px;border:1px solid var(--borde)">${opts}</select></div><div class="section"><div><h2>Objetivos y resultados clave</h2><p>Cada KR incluye botón de evolución interactiva.</p></div></div>${os.map(objHtml).join('')}`;$('selGer').onchange=e=>{selected=e.target.value;renderDetalle()}}
function objHtml(o){let v=avg(o.k.map(x=>x[5]));return `<article class="card okr-objective"><div class="row"><div><h3>${o.o}</h3><div class="mini">Propietario: ${o.owner}</div></div><span class="pill ${estado(v).toLowerCase()}">${v}%</span></div>${o.k.map((k,i)=>krHtml(o,k,i)).join('')}</article>`}
function krHtml(o,k,i){let id=krId(o,i);return `<div class="kr"><div class="row"><div class="kr-title">${k[0]} · ${k[1]}</div><span class="pill ${estado(k[5]).toLowerCase()}">${k[5]}%</span></div><div class="kr-grid"><div><span>Línea base</span><strong>${k[2]}</strong></div><div><span>Meta</span><strong>${k[3]}</strong></div><div><span>Valor actual</span><strong>${k[4]}</strong></div><div><span>Fuente</span><strong>Reporte gerencial</strong></div></div><div class="progress ${cls(k[5])}" style="--v:${k[5]}%"><span></span></div><button class="btn ghost" style="margin-top:12px" onclick="toggleChart('${id}',${k[5]})">Ver evolución</button><div class="chart-wrap" id="wrap_${id}"><svg class="chart" id="chart_${id}" viewBox="0 0 700 220"></svg></div></div>`}
function toggleChart(id,v){let w=$('wrap_'+id),s=$('chart_'+id);w.classList.toggle('open');if(w.classList.contains('open'))draw(s,hist(v))}
function draw(svg,data){let W=700,H=220,p=35;let x=i=>p+i*(W-2*p)/(data.length-1),y=v=>H-p-v*(H-2*p)/100;svg.innerHTML=`<line x1="${p}" y1="${y(100)}" x2="${W-p}" y2="${y(100)}" stroke="#FD8983" stroke-dasharray="5 5"/><text x="${W-p-70}" y="${y(100)+15}" font-size="12" fill="#A9342D">Meta 100%</text><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#D8D8E8"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="#D8D8E8"/>`;let pts=data.map((d,i)=>[x(i),y(d.v)]);svg.innerHTML+=`<polyline fill="none" stroke="#221E7C" stroke-width="4" points="${pts.map(a=>a.join(',')).join(' ')}"/>`;data.forEach((d,i)=>{svg.innerHTML+=`<text x="${x(i)-10}" y="${H-10}" font-size="12" fill="#666">${d.m}</text><circle class="point" cx="${x(i)}" cy="${y(d.v)}" r="7" fill="#78D6BB" stroke="#221E7C" stroke-width="3" tabindex="0" data-m="${d.m}" data-v="${d.v}"/>`})}
document.addEventListener('mouseover',e=>{if(e.target.classList.contains('point')){let t=$('tooltip');t.style.display='block';t.style.left=(e.pageX+12)+'px';t.style.top=(e.pageY+12)+'px';t.innerHTML=`<strong>${e.target.dataset.m}</strong><br>Cumplimiento: ${e.target.dataset.v}%`}});document.addEventListener('mouseout',e=>{if(e.target.classList.contains('point'))$('tooltip').style.display='none'});
function renderRanking(){$('ranking').innerHTML=hero('Ranking y comparación ejecutiva','Vista comparativa para priorizar apoyos, identificar riesgos y monitorear avance por gerencia.')+`<div class="grid two"><div class="card"><h2>Ranking general</h2>${rankingHtml()}</div><div class="card"><h2>Lectura institucional</h2><p class="muted">La comparación busca ordenar información de avance, detectar brechas y facilitar decisiones de gestión.</p><hr><strong>Mayor avance:</strong><p>${gerencias.slice().sort((a,b)=>b.cumplimiento-a.cumplimiento)[0].nombre}</p><strong>Mayor riesgo:</strong><p>${gerencias.slice().sort((a,b)=>a.cumplimiento-b.cumplimiento)[0].nombre}</p></div></div>`}
function renderHistorico(){let rows=[];objetivos.forEach(o=>o.k.forEach((k,i)=>hist(k[5]).forEach(h=>rows.push([h.m,gerencias.find(g=>g.id==o.g).sigla,k[0],k[1],h.v]))));$('historico').innerHTML=hero('Histórico de avances','Trazabilidad resumida por gerencia, objetivo y resultado clave.')+`<table class="table"><thead><tr><th>Fecha</th><th>Gerencia</th><th>KR</th><th>Resultado clave</th><th>Cumplimiento</th></tr></thead><tbody>${rows.slice(-35).map(r=>`<tr><td>${r[0]} 2026</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><strong>${r[4]}%</strong></td></tr>`).join('')}</tbody></table>`}
function renderCarga(){$('carga').innerHTML=hero('Carga de avances','Formulario simulado para representar actualización bimensual de resultados clave.')+`<div class="card"><form class="form" onsubmit="event.preventDefault();alert('Avance simulado guardado para maqueta');"><select>${gerencias.map(g=>`<option>${g.nombre}</option>`).join('')}</select><select>${objetivos.map(o=>`<option>${o.o}</option>`).join('')}</select><input type="date"><input placeholder="Valor reportado"><input placeholder="Cumplimiento reportado (%)"><textarea rows="4" placeholder="Comentario ejecutivo"></textarea><input placeholder="URL de evidencia"><button class="btn" type="submit">Guardar avance simulado</button></form></div>`}
go('panel');
</script>
</body>
</html>
