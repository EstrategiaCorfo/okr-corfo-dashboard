<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/corfo-presentaciones-sistema-de-dise-o-89cd5d5e-c76f-481a-a3fe-1b1397a92a05/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/corfo-presentaciones-sistema-de-dise-o-89cd5d5e-c76f-481a-a3fe-1b1397a92a05/tokens/colors.css">
  <link rel="stylesheet" href="_ds/corfo-presentaciones-sistema-de-dise-o-89cd5d5e-c76f-481a-a3fe-1b1397a92a05/tokens/typography.css">
  <script src="_ds/corfo-presentaciones-sistema-de-dise-o-89cd5d5e-c76f-481a-a3fe-1b1397a92a05/_ds_bundle.js"></script>
  <script src="okr-app.js"></script>
</helmet>
<section data-noprint="" aria-label="Filtros" style="width:100%;background:#FFFFFF;border-top:3px solid #17183B;border-bottom:1px solid #C9CAD5;padding:12px 0;display:flex;flex-direction:column;gap:10px;font-family:var(--font-sans)">
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-expanded="{{ openStr }}" onClick="{{ toggleOpen }}" style="min-height:44px;padding:0 14px;background:#EDF0F5;border:0;color:#17183B;font-family:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer">{{ toggleText }}</button>
  </sc-if>
  <sc-if value="{{ showFields }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
      <sc-for list="{{ selects }}" as="s" hint-placeholder-count="3">
        <label style="{{ s.labelStyle }}">{{ s.label }}
          <select value="{{ s.value }}" onChange="{{ s.onChange }}" style="height:40px;padding:0 10px;border:1px solid #C9CAD5;border-radius:0;background:#FFFFFF;color:#17183B;font-family:inherit;font-size:14px;width:100%">
            <sc-for list="{{ s.options }}" as="o" hint-placeholder-count="3">
              <option value="{{ o.value }}">{{ o.label }}</option>
            </sc-for>
          </select>
        </label>
      </sc-for>
      <sc-if value="{{ showSearch }}" hint-placeholder-val="{{ false }}">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#17183B;min-width:200px;flex:1.4 1 220px">Buscar Resultado Clave
          <input type="search" value="{{ qInput }}" onChange="{{ onQuery }}" placeholder="Código o palabra clave" style="height:40px;padding:0 10px;border:1px solid #C9CAD5;border-radius:0;background:#FFFFFF;color:#17183B;font-family:inherit;font-size:14px;width:100%"></input>
        </label>
      </sc-if>
      <button type="button" onClick="{{ clearAll }}" style="height:40px;padding:0 16px;background:#17183B;border:0;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;flex:0 0 auto" style-hover="background:#0C0D22">Limpiar filtros</button>
    </div>
  </sc-if>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:28px">
    <span style="font-size:12px;color:#3F3F3F">Filtros activos:</span>
    <sc-if value="{{ noChips }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;color:#3F3F3F">Ninguno</span></sc-if>
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="0">
      <button type="button" onClick="{{ c.onClear }}" aria-label="{{ c.aria }}" style="min-height:28px;padding:0 10px;display:flex;align-items:center;gap:8px;background:#EDF0F5;border:0;color:#17183B;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer" style-hover="color:#D64045">{{ c.label }}<span aria-hidden="true">×</span></button>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;140px&quot;},&quot;period&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;objective&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;owner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;search&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;bitacora&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(f: object) =&gt; void&quot;}}">
const PARAM = {period:'periodo', objective:'objetivo', owner:'owner', area:'area', q:'q', inst:'instancia', status:'estatus', exec:'hito'};

class Component extends DCLogic {
  state = { f:null, qInput:'', owners:[], isMobile:false, open:false };

  componentDidMount() {
    this._mq = () => this.setState({isMobile: window.innerWidth < 700});
    this._mq(); window.addEventListener('resize', this._mq);
    const wait = () => {
      if (!window.OKR) return setTimeout(wait, 20);
      const f = window.OKR.readFilters(); this.setState({f, qInput:f.q});
      window.OKR.load().then(d => this.setState({owners:this.props.catalog ? d.allOwners : d.owners, areas:(this.props.catalog ? d.allAreas : d.areas) || []}));
    };
    wait();
  }
  componentWillUnmount() { window.removeEventListener('resize', this._mq); clearTimeout(this._deb); }

  update(patch) {
    const O = window.OKR; if (!O) return;
    const f = Object.assign({}, this.state.f, patch), w = {};
    Object.keys(patch).forEach(k => { w[PARAM[k]] = patch[k]; });
    O.writeParams(w);
    this.setState({f, qInput: f.q});
    if (this.props.onChange) this.props.onChange(f);
  }

  renderVals() {
    const O = window.OKR, {f, isMobile, open, owners} = this.state, areas = this.state.areas || [], P = this.props;
    const showPeriod = P.period !== false, showObjective = P.objective !== false, showOwner = P.owner !== false, showArea = !!P.area, bit = !!P.bitacora, showSearch = !!P.search;
    const base = {isMobile, showFields: !isMobile || open, openStr: open ? 'true' : 'false', toggleOpen: () => this.setState(s => ({open:!s.open})), showSearch, qInput:this.state.qInput};
    if (!O || !f) return Object.assign(base, {selects:[], chips:[], noChips:true, toggleText:'Filtros'});
    const lbl = (grow, min) => `display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#17183B;min-width:${min}px;flex:${grow} 1 ${min}px`;
    const sel = (key, label, options, grow, min) => ({label, value:f[key], options, labelStyle:lbl(grow, min), onChange: e => this.update({[key]:e.target.value})});
    const selects = [];
    if (bit) {
      selects.push(sel('inst', 'Tipo de reunión', [{value:'', label:'Todas las instancias'}, ...O.INSTANCE_ORDER.map(v => ({value:v, label:O.INSTANCE[v]}))], 1, 160));
      selects.push(sel('exec', 'Estado del KR', [{value:'', label:'Todos los estados'}, ...Object.keys(O.EXEC).map(v => ({value:v, label:O.EXEC[v].label}))], 1, 160));
      selects.push(sel('status', 'Nivel de confianza', [{value:'', label:'Todos los niveles'}, ...Object.keys(O.STATUS).map(v => ({value:v, label:O.STATUS[v].label}))], 1, 170));
    }
    const areaSel = () => sel('area', 'Área responsable', [{value:'', label:'Todas las áreas'}, ...areas.map(o => ({value:o, label:o})), {value:'__vacio__', label:'Sin área informada'}], 1.2, 180);
    const ownerSel = () => sel('owner', 'Owner', [{value:'', label:'Todos los Owners'}, ...owners.map(o => ({value:o, label:o})), {value:'__vacio__', label:'Sin Owner informado'}], 1.2, 180);
    if (showObjective) selects.push(sel('objective', 'Objetivo Estratégico', [{value:'', label:'Todos los objetivos'}, ...O.OBJECTIVES.map(o => ({value:String(o.n), label:`${o.code} · ${o.name}`}))], 1.6, 220));
    if (showArea) selects.push(areaSel());
    if (showOwner) selects.push(ownerSel());
    if (showPeriod) selects.push(sel('period', 'Periodo', [{value:'todos', label:'Todos los periodos'}, ...O.PERIODS.map(p => ({value:p, label:O.periodLabel(p)}))], 1, 150));

    const chips = [], clear = k => () => this.update({[k]: k === 'period' ? O.defaultPeriod() : ''});
    if (showPeriod && f.period !== O.defaultPeriod()) chips.push({label:O.periodLabel(f.period), aria:'Volver al periodo en curso', onClear:clear('period')});
    if (showObjective && f.objective) chips.push({label:'Objetivo ' + O.code(f.objective), aria:'Quitar filtro de objetivo', onClear:clear('objective')});
    if (showArea && f.area) chips.push({label: f.area === '__vacio__' ? 'Sin área informada' : f.area, aria:'Quitar filtro de área', onClear:clear('area')});
    if (showOwner && f.owner) chips.push({label: f.owner === '__vacio__' ? 'Sin Owner informado' : f.owner, aria:'Quitar filtro de Owner', onClear:clear('owner')});
    if (bit && f.inst) chips.push({label:O.INSTANCE[f.inst], aria:'Quitar filtro de instancia', onClear:clear('inst')});
    if (bit && f.status) chips.push({label:O.STATUS[f.status].label, aria:'Quitar filtro de nivel de confianza', onClear:clear('status')});
    if (bit && f.exec) chips.push({label:O.EXEC[f.exec].label, aria:'Quitar filtro de estado del hito', onClear:clear('exec')});
    if (showSearch && f.q) chips.push({label:'“' + f.q + '”', aria:'Quitar búsqueda', onClear:clear('q')});

    return Object.assign(base, {selects, chips, noChips:chips.length === 0,
      toggleText:(open ? 'Ocultar filtros' : 'Filtros') + (chips.length ? ` (${chips.length} activos)` : ''),
      onQuery: e => { const v = e.target.value; this.setState({qInput:v}); clearTimeout(this._deb); this._deb = setTimeout(() => this.update({q:v.trim()}), 200); },
      clearAll: () => { const p = {}; if (showPeriod) p.period = O.defaultPeriod(); if (showObjective) p.objective = ''; if (showOwner) p.owner = ''; if (showArea) p.area = ''; if (showSearch) p.q = ''; if (bit) Object.assign(p, {inst:'', status:'', exec:''}); this.update(p); }});
  }
}
</script>
</body>
</html>
